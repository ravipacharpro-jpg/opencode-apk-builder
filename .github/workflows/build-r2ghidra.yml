name: Build r2ghidra (Android arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            meson \
            ninja-build \
            git \
            python3 \
            pkg-config \
            curl \
            wget \
            unzip

      - name: Install radare2 (latest from git)
        run: |
          git clone --depth=1 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          ./sys/install.sh --prefix=/usr/local
          r2 -version

      - name: Install r2ghidra via r2pm
        run: |
          r2pm -U
          r2pm -ci r2ghidra

      - name: Find r2ghidra plugin paths
        id: find_paths
        run: |
          echo "R2_USER_PLUGINS=$(r2 -H R2_USER_PLUGINS)" >> $GITHUB_OUTPUT
          echo "R2_LIBR_PLUGINS=$(r2 -H R2_LIBR_PLUGINS)" >> $GITHUB_OUTPUT

      - name: List plugin dirs for debugging
        run: |
          echo "=== User plugins ==="
          ls -la "$(r2 -H R2_USER_PLUGINS)/" 2>/dev/null | grep -i ghidra || echo "No ghidra in user plugins"
          echo "=== Libr plugins ==="
          ls -la "$(r2 -H R2_LIBR_PLUGINS)/" 2>/dev/null | grep -i ghidra || echo "No ghidra in libr plugins"
          echo "=== All plugin dirs ==="
          find / -name "*ghidra*" -type f 2>/dev/null | head -20

      - name: Upload r2ghidra plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2ghidra-plugin
          path: |
            ${{ steps.find_paths.outputs.R2_USER_PLUGINS }}/**/ghidra*
            ${{ steps.find_paths.outputs.R2_LIBR_PLUGINS }}/**/ghidra*
          retention-days: 7
          if-no-files-found: warn
